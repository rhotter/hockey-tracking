name: Verify public release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/verify_results.py
      - run: python scripts/verify_sam3_results.py
      - run: python scripts/verify_sam3_improvements.py
      - run: python scripts/verify_openai_results.py
      - run: python scripts/verify_roboflow_results.py
      - run: python scripts/verify_new_games.py
      - run: python scripts/verify_overhead.py
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments/openai-20261024 -p 'test_*.py' -v
      - run: python examples/reconnect.py
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
